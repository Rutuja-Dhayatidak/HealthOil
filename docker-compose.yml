version: '3.8'

services:
  # ── Backend API ─────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    env_file:
      - ./backend/.env
    expose:
      - "5000"
    networks:
      - app-network

  # ── Customer Frontend ───────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: https://healthyfood.cafe/api
        VITE_API_URL: https://healthyfood.cafe/api
    restart: always
    expose:
      - "80"
    networks:
      - app-network

  # ── Admin Dashboard ─────────────────────────────────────────────────
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        VITE_API_URL: https://healthyfood.cafe/api
    restart: always
    expose:
      - "80"
    networks:
      - app-network

  # ── Vendor Dashboard ────────────────────────────────────────────────
  vendor:
    build:
      context: ./vendor
      dockerfile: Dockerfile
      args:
        VITE_API_URL: https://healthyfood.cafe/api
    restart: always
    expose:
      - "80"
    networks:
      - app-network

  # ── Reverse Proxy (Nginx) ───────────────────────────────────────────
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - backend
      - frontend
      - admin
      - vendor
    networks:
      - app-network

  # ── SSL Certificate Auto-Renewer (Certbot) ──────────────────────────
  certbot:
    image: certbot/certbot
    restart: unless-stopped
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12d & wait $${!}; done;'"
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot

networks:
  app-network:
    driver: bridge
